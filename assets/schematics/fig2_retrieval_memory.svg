<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 542" width="700" height="542"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Retrieval-augmented memory</title>
  <desc>Offline, the frozen encoder maps a fold's training images into a memory bank holding an image level and a slide level. At inference the same frozen encoder produces a query key, the two levels are searched independently, and a fusion gate combines the image, slide and classifier probabilities into the final prediction.</desc>

  <defs>
    <marker id="bh" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.6 L9 5 L0 9.4 z" fill="#33383F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="542" fill="#FFFFFF"/>

  <!-- ================= band labels and divider ================= -->
  <text x="20" y="26" font-size="13" font-weight="600" letter-spacing="1.3" fill="#5C626B">OFFLINE &#183; MEMORY CONSTRUCTION</text>
  <line x1="20" y1="214" x2="680" y2="214" stroke="#D3D7DC" stroke-width="1.4"/>
  <text x="20" y="234" font-size="13" font-weight="600" letter-spacing="1.3" fill="#5C626B">INFERENCE</text>

  <!-- ================= connectors ================= -->
  <g fill="none" stroke="#33383F" stroke-width="1.6" marker-end="url(#bh)">
    <path d="M156 76  H188"/>
    <path d="M328 76  H357"/>
    <path d="M88 292  V320"/>
    <path d="M88 368  V396"/>
    <path d="M156 344 H342 V128 H357"/>
    <path d="M443.5 166 V262"/>
    <path d="M596.5 166 V262"/>
    <path d="M443.5 306 V394"/>
    <path d="M596.5 306 V394"/>
    <path d="M156 420 H250"/>
    <path d="M465 446 V476"/>
  </g>

  <!-- ================= offline band ================= -->
  <rect x="20" y="50" width="136" height="52" rx="4" fill="#FFFFFF" stroke="#454A52" stroke-width="1.6"/>
  <text x="88" y="76" font-size="16" fill="#16181D" text-anchor="middle">Training images</text>
  <text x="88" y="93" font-size="13" fill="#5C626B" text-anchor="middle">patients of the fold</text>

  <rect x="188" y="50" width="140" height="52" rx="4" fill="#E4F0F7" stroke="#0B6FA4" stroke-width="1.6"/>
  <text x="258" y="76" font-size="16" fill="#16181D" text-anchor="middle">Frozen encoder</text>
  <text x="258" y="93" font-size="13" fill="#5C626B" text-anchor="middle">shared with inference</text>

  <rect x="360" y="34" width="320" height="132" rx="4" fill="#FFFFFF" stroke="#B76A00" stroke-width="2.6"/>
  <text x="376" y="57" font-size="16" fill="#16181D">Memory bank</text>

  <rect x="374" y="70" width="139" height="82" rx="4" fill="#FBEEDA" stroke="#B76A00" stroke-width="1.6"/>
  <text x="443.5" y="98" font-size="16" fill="#16181D" text-anchor="middle">Image level</text>
  <text x="443.5" y="120" font-size="13" fill="#5C626B" text-anchor="middle">one key per</text>
  <text x="443.5" y="136" font-size="13" fill="#5C626B" text-anchor="middle">training image</text>

  <rect x="527" y="70" width="139" height="82" rx="4" fill="#FBEEDA" stroke="#B76A00" stroke-width="1.6"/>
  <text x="596.5" y="98" font-size="16" fill="#16181D" text-anchor="middle">Slide level</text>
  <text x="596.5" y="120" font-size="13" fill="#5C626B" text-anchor="middle">one centroid</text>
  <text x="596.5" y="136" font-size="13" fill="#5C626B" text-anchor="middle">per patient</text>

  <!-- ================= inference band ================= -->
  <rect x="20" y="244" width="136" height="48" rx="4" fill="#FFFFFF" stroke="#454A52" stroke-width="1.6"/>
  <text x="88" y="273" font-size="16" fill="#16181D" text-anchor="middle">Query image</text>

  <rect x="20" y="320" width="136" height="48" rx="4" fill="#E4F0F7" stroke="#0B6FA4" stroke-width="1.6"/>
  <text x="88" y="343" font-size="16" fill="#16181D" text-anchor="middle">Frozen encoder</text>
  <text x="88" y="360" font-size="13" fill="#5C626B" text-anchor="middle">same weights</text>

  <rect x="20" y="396" width="136" height="48" rx="4" fill="#E2F2EC" stroke="#0E7A5A" stroke-width="1.6"/>
  <text x="88" y="418" font-size="16" fill="#16181D" text-anchor="middle">Classifier head</text>
  <text x="88" y="434" font-size="13" font-style="italic" fill="#5C626B" text-anchor="middle">frozen</text>

  <text x="261" y="336" font-size="13" fill="#5C626B" text-anchor="middle">query key</text>

  <rect x="374" y="262" width="139" height="44" rx="4" fill="#FBEEDA" stroke="#B76A00" stroke-width="1.6"/>
  <text x="443.5" y="289" font-size="16" fill="#16181D" text-anchor="middle">Image retrieval</text>

  <rect x="527" y="262" width="139" height="44" rx="4" fill="#FBEEDA" stroke="#B76A00" stroke-width="1.6"/>
  <text x="596.5" y="289" font-size="16" fill="#16181D" text-anchor="middle">Slide retrieval</text>

  <!-- probability labels -->
  <text x="452" y="352" font-size="15" fill="#16181D"><tspan font-style="italic">p</tspan><tspan font-size="12" dy="3">img</tspan></text>
  <text x="605" y="352" font-size="15" fill="#16181D"><tspan font-style="italic">p</tspan><tspan font-size="12" dy="3">slide</tspan></text>
  <text x="203" y="410" font-size="15" fill="#16181D" text-anchor="middle"><tspan font-style="italic">p</tspan><tspan font-size="12" dy="3">param</tspan></text>

  <rect x="250" y="394" width="430" height="52" rx="4" fill="#FFFFFF" stroke="#0E7A5A" stroke-width="1.6"/>
  <text x="465" y="416" font-size="16" fill="#16181D" text-anchor="middle">Fusion gate</text>
  <text x="465" y="434" font-size="13" fill="#5C626B" text-anchor="middle">predicts the mixing weights &#183; the only learned component</text>

  <rect x="380" y="476" width="170" height="44" rx="4" fill="#E2F2EC" stroke="#0E7A5A" stroke-width="2"/>
  <text x="465" y="497" font-size="16" font-weight="600" fill="#16181D" text-anchor="middle">Final prediction</text>
  <text x="465" y="513" font-size="13" fill="#5C626B" text-anchor="middle">benign / malignant</text>
</svg>
